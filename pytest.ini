[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ; SQLite tidak punya tipe DECIMAL, jadi SQLAlchemy memperingatkan bahwa
    ; Numeric diperankan sebagai float di backend ini. Lihat catatan di
    ; tests/conftest.py tentang pengujian presisi uang.
    ignore:.*Decimal objects natively.*
markers =
    integration: butuh PostgreSQL atau akses jaringan; tidak jalan secara default
